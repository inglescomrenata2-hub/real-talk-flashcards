<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Real Talk Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F0E8;--cream2:#EDE4D3;--cream3:#E6DBC7;
  --espresso:#241A12;--espresso2:#2E2318;
  --terra:#C2714F;--amber:#C98A4B;--honey:#D69B5C;
  --ink:#1A1814;--muted:#7a6a58;--line:rgba(36,26,18,.14);
  --grad:linear-gradient(135deg,#C98A4B 0%,#C2714F 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.serif{font-family:'Playfair Display',Georgia,serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:560px;margin:0 auto;padding:22px 16px 40px}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:600}
h1{font-size:30px;font-weight:600;line-height:1.1;color:var(--espresso);margin-top:6px}
h1 i{color:var(--terra)}
.streak{background:var(--espresso);color:var(--cream);border-radius:16px;padding:10px 14px;text-align:center;min-width:84px;flex:none}
.streak b{display:block;font-family:'Playfair Display',serif;font-size:24px;line-height:1}
.streak span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}

/* habit week */
.habit{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:14px}
.habit-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.habit-top p{font-size:13px;color:var(--muted)}
.habit-top strong{font-size:13px;color:var(--espresso)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;font-size:10px;color:var(--muted);letter-spacing:.06em}
.dot{width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:4px;padding:1px;background:rgba(36,26,18,.12);transition:background .3s}
.dot i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;background-size:cover;background-position:center}
.dot.on{padding:3px;background:linear-gradient(45deg,#E0A86A 0%,#C98A4B 35%,#C2714F 70%,#A9533A 100%)}

/* week chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:50px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--espresso);color:var(--cream);border-color:var(--espresso)}

.week-info{margin-bottom:14px}
.week-info h2{font-size:20px;color:var(--espresso);font-weight:600}
.week-info p{font-size:13px;color:var(--muted);margin-top:2px}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:6px;background:var(--cream3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}

/* card */
.stage{perspective:1400px;margin-bottom:16px}
.card{position:relative;width:100%;height:min(380px,44vh);min-height:290px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:26px 24px;display:flex;flex-direction:column}
.front{background:#fff;border:1px solid var(--line);box-shadow:0 10px 40px rgba(36,26,18,.08)}
.back{background:var(--espresso);color:var(--cream);transform:rotateY(180deg);box-shadow:0 10px 40px rgba(36,26,18,.25)}
.face-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.front .face-top{color:var(--terra)}
.back .face-top{color:var(--honey)}
.tag{padding:4px 10px;border-radius:50px;background:rgba(194,113,79,.1);letter-spacing:.1em}
.back .tag{background:rgba(214,155,92,.15)}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.prompt-label{font-size:12px;color:var(--muted)}
.prompt{font-family:'Playfair Display',serif;font-size:clamp(22px,6vw,28px);line-height:1.3;color:var(--espresso)}
.answer{font-family:'Playfair Display',serif;font-size:clamp(24px,6.6vw,31px);line-height:1.25}
.answer em{color:var(--honey);font-style:italic}
.tip{font-size:13.5px;line-height:1.55;color:rgba(245,240,232,.75);border-top:1px solid rgba(245,240,232,.15);padding-top:12px}
.tip b{color:var(--honey);font-weight:600}
.hint{font-size:12px;color:var(--muted);text-align:center}
.listen{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--honey);border:1px solid rgba(214,155,92,.4);padding:7px 12px;border-radius:50px}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:15px;border-radius:14px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-again{background:#fff;border:1px solid var(--line);color:var(--espresso)}
.btn-know{background:var(--grad);color:#fff}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.tools{display:flex;justify-content:center;gap:18px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.tools button{text-decoration:underline;text-underline-offset:3px}

/* done */
.done{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 24px}
.done.show{display:block}
.done .big{font-size:44px}
.done h3{font-family:'Playfair Display',serif;font-size:26px;color:var(--espresso);margin:10px 0 6px}
.done p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:20px}
.done .btn{margin:0 auto;max-width:260px}

footer{text-align:center;margin-top:28px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
footer b{color:var(--terra);font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="eyebrow">English Pocket Planner</p>
      <h1 class="serif">Real Talk <i>Flashcards</i></h1>
    </div>
    <div class="streak"><b id="streak">0</b><span>dias seguidos</span></div>
  </header>

  <div class="habit">
    <div class="habit-top"><p>Seu hábito desta semana</p><strong id="habit-count">0/7</strong></div>
    <div class="days" id="days"></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="week-info"><h2 class="serif" id="w-title"></h2><p id="w-sub"></p></div>

  <div class="prog"><div class="bar"><i id="bar"></i></div><span id="prog-txt"></span></div>

  <div id="study">
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="face-top"><span id="f-num"></span><span class="tag" id="f-tag"></span></div>
          <div class="face-body">
            <p class="prompt-label">Como você diria em inglês?</p>
            <p class="prompt" id="f-prompt"></p>
          </div>
          <p class="hint">Fale em voz alta e toque pra virar ↻</p>
        </div>
        <div class="face back">
          <div class="face-top"><span>Real Talk</span><span class="tag" id="b-tag"></span></div>
          <div class="face-body">
            <p class="answer" id="b-answer"></p>
            <button class="listen" id="listen" type="button">▶ Ouvir</button>
            <p class="tip" id="b-tip"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-again" id="again" disabled>↺ Revisar de novo</button>
      <button class="btn btn-know" id="know" disabled>✓ Já sei</button>
    </div>
  </div>

  <div class="done" id="done">
    <div class="big">🤎</div>
    <h3>Sessão concluída!</h3>
    <p id="done-txt"></p>
    <button class="btn btn-know" id="restart">+5 cartas extras</button>
  </div>


  <footer>by <b>teacher Renata</b> · Renata em Inglês</footer>
</div>

const KEY="rtf_v2", SESSION=10, NEW_PER_DAY=6, GAPS=[0,1,3,7,14,30];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let st=load(); st.cards=st.cards||{}; st.days=st.days||[]; st.week=st.week??-1; st.newToday=st.newToday||{};

const $=id=>document.getElementById(id);
let queue=[],idx=0,flipped=false;

function todayStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d)}
function markToday(){const t=todayStr(); if(!st.days.includes(t)){st.days.push(t);save();renderHabit();}}
function streak(){let n=0,d=new Date(); if(!st.days.includes(todayStr(d))) d.setDate(d.getDate()-1);
  while(st.days.includes(todayStr(d))){n++;d.setDate(d.getDate()-1)} return n}
function renderHabit(){
  const now=new Date(), mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const names=["SEG","TER","QUA","QUI","SEX","SÁB","DOM"]; let html="",cnt=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const on=st.days.includes(todayStr(d));if(on)cnt++;
    const today=todayStr(d)===todayStr(now);
    html+=`<div class="day"><div class="dot ${on?"on":""}"><i style="background-image:url(${DAY_IMGS[i]})"></i></div>${names[i]}</div>`}
  $("days").innerHTML=html; $("habit-count").textContent=cnt+"/7"; $("streak").textContent=streak();
}

const ALL=[]; WEEKS.forEach((w,wi)=>w.c.forEach((c,ci)=>ALL.push({id:wi+"-"+ci,w:wi,c})));
const pool=()=>st.week<0?ALL:ALL.filter(x=>x.w===st.week);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mastered=p=>p.filter(x=>(st.cards[x.id]?.box||0)>=3).length;

function buildSession(extra=false){
  const t=todayStr(), p=pool();
  const due=shuffle(p.filter(x=>st.cards[x.id] && st.cards[x.id].due<=t)).sort((a,b)=>st.cards[a.id].box-st.cards[b.id].box);
  const usedNew=st.newToday[t]||0, roomNew=extra?5:Math.max(0,NEW_PER_DAY-usedNew);
  // cartas novas: semanas mais cedo primeiro, embaralhadas dentro da semana
  const fresh=shuffle(p.filter(x=>!st.cards[x.id])).sort((a,b)=>a.w-b.w).slice(0,roomNew);
  let s=[...due.slice(0,SESSION-Math.min(fresh.length,3)),...fresh];
  s=shuffle(s.slice(0,extra?5:SESSION));
  if(!s.length && extra){ // tudo em dia: pega as menos vistas recentemente
    s=shuffle([...p]).sort((a,b)=>(st.cards[a.id]?.due||"")<(st.cards[b.id]?.due||"")?-1:1).slice(0,5);
  }
  return s;
}
function renderChips(){
  const opts=[{i:-1,t:"Todas"},...WEEKS.map((w,i)=>({i,t:w.t}))];
  $("chips").innerHTML=opts.map(o=>`<button class="chip ${o.i===st.week?"on":""}" data-i="${o.i}">${o.t}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.week=+b.dataset.i;save();start()});
}
function start(extra=false){
  const p=pool();
  $("w-title").textContent=st.week<0?"Sessão de hoje":WEEKS[st.week].t+" · "+WEEKS[st.week].s;
  $("w-sub").textContent=st.week<0?"Revisões do dia + cartas novas, de todas as semanas":p.length+" cartas nesta semana";
  queue=buildSession(extra); idx=0; renderChips(); show();
}
function updateProg(){const p=pool(),m=mastered(p);$("bar").style.width=(m/p.length*100)+"%";$("prog-txt").textContent=m+"/"+p.length+" dominadas"}
function show(){
  const wasFlipped=flipped; updateProg(); flipped=false; $("card").classList.remove("flip"); $("again").disabled=$("know").disabled=true;
  if(idx>=queue.length){$("study").style.display="none";$("done").classList.add("show");
    const t=addDays(1), next=pool().filter(x=>st.cards[x.id]&&st.cards[x.id].due<=t).length;
    $("done-txt").innerHTML=`Mais um dia de inglês no seu hábito.<br>Amanhã você tem <b>${next} revisões</b> + cartas novas esperando.`;
    return}
  $("study").style.display="";$("done").classList.remove("show");
  const x=queue[idx], c=x.c, isNew=!st.cards[x.id];
  $("f-num").textContent=String(idx+1).padStart(2,"0")+" / "+String(queue.length).padStart(2,"0")+(isNew?" · NOVA":" · REVISÃO");
  $("f-tag").textContent=c[3]; $("f-prompt").textContent=c[0];
  setTimeout(()=>{ $("b-tag").textContent=WEEKS[x.w].t+" · "+c[3]; $("b-answer").innerHTML=c[1]; $("b-tip").innerHTML=c[2]; }, wasFlipped?600:0);
}
function grade(ok){
  const x=queue[idx], t=todayStr();
  if(!st.cards[x.id]){st.newToday[t]=(st.newToday[t]||0)+1; st.cards[x.id]={box:0,due:t}}
  const r=st.cards[x.id];
  if(ok){ r.box=Math.min(r.box+1,5); r.due=addDays(GAPS[r.box]); }
  else { r.box=0; r.due=t; if(queue.slice(idx+1).filter(q=>q.id===x.id).length===0) queue.push(x); }
  save(); markToday(); idx++; show();
}
$("card").onclick=e=>{ if(e.target.closest(".listen"))return; flipped=!flipped; $("card").classList.toggle("flip",flipped); if(flipped){$("again").disabled=$("know").disabled=false}};
$("listen").onclick=()=>{ if(!("speechSynthesis" in window))return; const u=new SpeechSynthesisUtterance($("b-answer").textContent); u.lang="en-US"; u.rate=.92; speechSynthesis.cancel(); speechSynthesis.speak(u)};
$("know").onclick=()=>grade(true);
$("again").onclick=()=>grade(false);
$("restart").onclick=()=>start(true);
document.addEventListener("keydown",e=>{ if(e.key===" "){e.preventDefault();$("card").click()} if(flipped&&e.key==="ArrowRight")$("know").click(); if(flipped&&e.key==="ArrowLeft")$("again").click()});

renderHabit(); start();

</script>
